name: CodeQL

# GitHub's code scanner, free for public repositories. It looks for security
# problems such as injection and unsafe file or network handling, and lists
# findings under Security > Code scanning.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries also run against code that has not changed.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # Python needs no build; CodeQL reads the source directly.
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
